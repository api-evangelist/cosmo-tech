aid: cosmo-tech
name: Cosmo Tech
description: >-
  Cosmo Tech is a predictive and prescriptive AI-simulation (digital twin) platform for industry,
  based in Lyon, France and backed by Insight Partners. Its open-source Cosmo Tech Cloud Platform API
  (Kotlin, MIT) lets teams model organizations, workspaces, solutions, datasets, runners and runs, then
  configure and execute large-scale what-if simulations across supply chains, asset investment planning
  and enterprise operations. The API is modular across seven service specs (organization, workspace,
  solution, dataset, runner, run, meta), authenticates via OAuth2 / OpenID Connect (Keycloak), and ships
  auto-generated TypeScript and Python clients plus the Babylon CLI.
